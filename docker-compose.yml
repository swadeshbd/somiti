version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: microcredit_postgres
    restart: always
    environment:
      POSTGRES_USER: microcredit_user
      POSTGRES_PASSWORD: microcredit_password_2026
      POSTGRES_DB: microcredit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microcredit_user -d microcredit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: microcredit_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "Microcredit Borrower API"
      DATABASE_URL: "postgresql://microcredit_user:microcredit_password_2026@db:5432/microcredit_db"
      SECRET_KEY: "prod-secret-mra-compliant-key-change-in-production-2026"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
